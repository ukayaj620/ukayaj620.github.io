<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Countries</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-neutral-50">
    <main class="mx-auto w-full max-w-7xl px-6 py-10">
      <div class="mb-8 flex items-center justify-between">
        <h1 class="text-3xl font-bold">Countries</h1>

        <div class="flex items-center gap-2">
          <button
            id="previous-button"
            class="rounded-lg border border-neutral-200 bg-white px-4 py-2 text-sm font-medium hover:bg-neutral-50 disabled:cursor-not-allowed disabled:opacity-50"
          >
            Previous
          </button>

          <span id="page-number" class="px-2 text-sm text-neutral-500">
            Page 1
          </span>

          <button
            id="next-button"
            class="rounded-lg border border-neutral-200 bg-white px-4 py-2 text-sm font-medium hover:bg-neutral-50 disabled:cursor-not-allowed disabled:opacity-50"
          >
            Next
          </button>
        </div>
      </div>

      <div
        id="countries"
        class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3"
      ></div>
    </main>

    <script>
      const LIMIT = 9;

      let page = 1;

      const countriesContainer = document.getElementById("countries");
      const previousButton = document.getElementById("previous-button");
      const nextButton = document.getElementById("next-button");
      const pageNumber = document.getElementById("page-number");

      async function getCountries() {
        const offset = (page - 1) * LIMIT;

        try {
          countriesContainer.innerHTML = "<p>Loading...</p>";

          const response = await fetch(
            `https://api.restcountries.com/countries/v5?limit=${LIMIT}&offset=${offset}`,
            {
              headers: {
                Authorization:
                  "Bearer rc_live_7798edf19ab94eb2aaf624d54d2f1f71",
              },
            },
          );

          const result = await response.json();

          if (!response.ok) {
            throw new Error(
              result.errors?.[0]?.message ?? "Failed to fetch countries",
            );
          }

          const countries = result.data.objects;

          renderCountries(countries);

          pageNumber.textContent = `Page ${page}`;

          previousButton.disabled = page === 1;
          nextButton.disabled = countries.length < LIMIT;
        } catch (error) {
          countriesContainer.innerHTML = `
          <p class="text-red-500">
            ${error.message}
          </p>
        `;
        }
      }

      function renderCountries(countries) {
        countriesContainer.innerHTML = "";

        countries.forEach((country) => {
          const capital =
            country.capitals?.map((capital) => capital.name).join(", ") ??
            "N/A";

          const languages =
            country.languages?.map((language) => language.name).join(", ") ??
            "N/A";

          const currency = country.currencies
            ? Object.values(country.currencies)[0]
            : undefined;

          const article = document.createElement("article");

          article.className =
            "overflow-hidden rounded-xl border border-neutral-200 bg-white";

          article.innerHTML = `
          <div class="flex h-48 items-center justify-center bg-neutral-100">
            ${
              country.flag?.url_png
                ? `
                  <img
                    src="${country.flag.url_png}"
                    alt="${
                      country.flag.description ?? `${country.names.common} flag`
                    }"
                    class="h-full w-full object-cover"
                  />
                `
                : `
                  <span class="text-7xl">
                    ${country.flag?.emoji ?? ""}
                  </span>
                `
            }
          </div>

          <div class="p-5">
            <div class="flex items-start justify-between gap-4">
              <div>
                <h2 class="text-xl font-semibold">
                  ${country.names.common}
                </h2>

                <p class="mt-1 text-sm text-neutral-500">
                  ${country.names.official}
                </p>
              </div>
            </div>

            <div class="mt-5 space-y-3 text-sm">
              <div>
                <p class="text-neutral-500">
                  Capital
                </p>

                <p class="font-medium">
                  ${capital}
                </p>
              </div>

              <div>
                <p class="text-neutral-500">
                  Region
                </p>

                <p class="font-medium">
                  ${country.region ?? "N/A"}
                  ${country.subregion ? ` · ${country.subregion}` : ""}
                </p>
              </div>

              <div>
                <p class="text-neutral-500">
                  Population
                </p>

                <p class="font-medium">
                  ${country.population?.toLocaleString() ?? "N/A"}
                </p>
              </div>

              <div>
                <p class="text-neutral-500">
                  Currency
                </p>

                <p class="font-medium">
                  ${
                    currency
                      ? `${currency.name}${
                          currency.symbol ? ` (${currency.symbol})` : ""
                        }`
                      : "N/A"
                  }
                </p>
              </div>

              <div>
                <p class="text-neutral-500">
                  Languages
                </p>

                <p class="font-medium">
                  ${languages}
                </p>
              </div>
            </div>
          </div>
        `;

          countriesContainer.appendChild(article);
        });
      }

      previousButton.addEventListener("click", () => {
        if (page > 1) {
          page--;
          getCountries();
        }
      });

      nextButton.addEventListener("click", () => {
        page++;
        getCountries();
      });

      getCountries();
    </script>
  </body>
</html>
